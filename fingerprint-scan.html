<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>玄镜 AegisScope 指纹扫描</title>
  <link rel="stylesheet" href="fingerprint-scan.css">
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <div class="mark" aria-hidden="true"><img src="icons/icon48.png" alt=""></div>
      <div>
        <h1>玄镜 AegisScope 指纹扫描 <span class="version">V2.1.1</span></h1>
        <span id="origin" class="origin"></span>
      </div>
    </div>
    <div class="actions">
      <a class="repo-link" href="https://github.com/flagqaz/AegisScope" target="_blank" rel="noreferrer" title="GitHub: flagqaz/AegisScope" aria-label="打开 GitHub 项目">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.52 2.87 8.35 6.85 9.7.5.09.68-.22.68-.49l-.01-1.9c-2.78.62-3.37-1.2-3.37-1.2-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.55-1.14-4.55-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.34 9.34 0 0 1 12 6.94c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9l-.01 2.79c0 .27.18.59.69.49A10.15 10.15 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"/></svg>
      </a>
      <a class="top-author-link" href="https://github.com/flagqaz/AegisScope" target="_blank" rel="noreferrer">by.农夫三拳</a>
      <button id="start" class="primary">开始扫描</button>
      <button id="stop">停止</button>
      <button id="exportJson">导出 JSON</button>
      <button id="exportMd">导出 Markdown</button>
    </div>
  </header>

  <section class="target-strip">
    <div>
      <span class="label">目标</span>
      <strong id="targetHost">-</strong>
      <span id="targetUrl" class="target-url"></span>
    </div>
    <span id="scanState" class="state">待接入</span>
  </section>

  <section class="summary">
    <div class="card score">
      <div class="label">识别状态</div>
      <div class="value" id="overallState">未开始</div>
      <div class="sub" id="scanProgress">fingerprint 0</div>
    </div>
    <div class="card">
      <div class="label">指纹命中</div>
      <div class="value" id="hitCount">0</div>
      <div class="sub" id="highCount">高置信 0</div>
    </div>
    <div class="card">
      <div class="label">组件版本</div>
      <div class="value" id="versionCount">0</div>
      <div class="sub" id="versionSub">待提取</div>
    </div>
    <div class="card">
      <div class="label">证据片段</div>
      <div class="value" id="evidenceCount">0</div>
      <div class="sub" id="evidenceSub">待扫描</div>
    </div>
  </section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="过滤指纹、分类、版本、证据" />
    <select id="category">
      <option value="all">全部分类</option>
      <option value="cms">CMS</option>
      <option value="framework">框架</option>
      <option value="server">Web 服务</option>
      <option value="middleware">中间件</option>
      <option value="cdn">CDN / 安全</option>
      <option value="oa">OA / ERP</option>
      <option value="device">设备 / 网关</option>
      <option value="devops">开发运维</option>
    </select>
    <select id="confidence">
      <option value="all">全部置信度</option>
      <option value="high">高置信</option>
      <option value="medium">中置信</option>
      <option value="low">低置信</option>
    </select>
  </section>

  <main class="workspace">
    <section class="panel results-panel">
      <div class="panel-head">
        <h2>指纹结果</h2>
        <span id="resultMeta">0 项</span>
      </div>
      <div id="fingerprints" class="fingerprints">
        <div class="empty-state">
          <strong>等待指纹扫描</strong>
          <span>扫描引擎接入后将在这里展示命中的产品、组件、版本和置信度。</span>
        </div>
      </div>
    </section>

    <aside class="panel side-panel">
      <div class="panel-head">
        <h2>命中证据</h2>
      </div>
      <div id="evidence" class="evidence-list">
        <div class="evidence-empty">暂无证据</div>
      </div>
    </aside>
  </main>

  <footer class="page-footer">
    <span>玄镜 AegisScope</span>
    <a class="author-link" href="https://github.com/flagqaz/AegisScope" target="_blank" rel="noreferrer">by.农夫三拳</a>
  </footer>

  <script src="fingerprint-rules.js"></script>
  <script src="fingerprint-scan.js"></script>
</body>
</html>
