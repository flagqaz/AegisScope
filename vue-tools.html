<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>玄镜 AegisScope Vue 控制台</title>
  <link rel="stylesheet" href="vue-tools.css">
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <div class="mark" aria-hidden="true"><img src="icons/icon48.png" alt=""></div>
      <div>
        <h1>玄镜 AegisScope Vue 控制台 <span class="version">V2.1.1</span></h1>
        <span id="origin" class="origin"></span>
      </div>
    </div>
    <div class="actions">
      <a class="repo-link" href="https://github.com/flagqaz/AegisScope" target="_blank" rel="noreferrer" title="GitHub: flagqaz/AegisScope" aria-label="打开 GitHub 项目">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.52 2.87 8.35 6.85 9.7.5.09.68-.22.68-.49l-.01-1.9c-2.78.62-3.37-1.2-3.37-1.2-.45-1.19-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.55-1.14-4.55-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.34 9.34 0 0 1 12 6.94c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9l-.01 2.79c0 .27.18.59.69.49A10.15 10.15 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"/></svg>
      </a>
      <a class="top-author-link" href="https://github.com/flagqaz/AegisScope" target="_blank" rel="noreferrer">by.农夫三拳</a>
      <button id="analyze" class="primary">分析实例</button>
      <button id="restore" class="danger">恢复</button>
      <button id="exportJson">导出 JSON</button>
    </div>
  </header>

  <section class="summary">
    <div class="card">
      <div class="label">Vue</div>
      <div class="value" id="vueStatus">-</div>
      <div class="sub" id="vueMeta">-</div>
    </div>
    <div class="card">
      <div class="label">Router</div>
      <div class="value" id="routerStatus">-</div>
      <div class="sub" id="routerMeta">-</div>
    </div>
    <div class="card">
      <div class="label">Routes</div>
      <div class="value" id="routeCount">0</div>
      <div class="sub" id="sensitiveCount">0 sensitive</div>
    </div>
    <div class="card">
      <div class="label">Guards</div>
      <div class="value" id="guardCount">0</div>
      <div class="sub" id="guardMeta">-</div>
    </div>
  </section>

  <section class="grid">
    <div class="panel">
      <div class="panel-head">
        <h2>路由列表</h2>
        <input id="routeSearch" type="search" placeholder="过滤 path / name / meta">
      </div>
      <div id="routes" class="route-list"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>运行时详情</h2>
        <span id="status" class="status">就绪</span>
      </div>
      <pre id="details"></pre>
    </div>
  </section>

  <footer class="page-footer">
    <span>玄镜 AegisScope</span>
    <a class="author-link" href="https://github.com/flagqaz/AegisScope" target="_blank" rel="noreferrer">by.农夫三拳</a>
  </footer>

  <dialog id="confirmDialog">
    <header>
      <strong id="confirmTitle">确认操作</strong>
    </header>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button id="confirmCancel">取消</button>
      <button id="confirmOk" class="danger">确认</button>
    </div>
  </dialog>

  <script src="vue-tools.js"></script>
</body>
</html>
