<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>玄镜 AegisScope · 提取网页数据</title><link rel="stylesheet" href="../styles/web-data.css"></head>
<body><main>
<header><img src="../icons/icon48.png" alt=""><div><h1>提取网页数据</h1><small id="source"></small></div></header>
<section class="controls">
<label>采集区域 <select id="area"></select></label><button id="refresh">重新识别</button>
<label>连续采集 <select id="mode"><option value="next">点击下一页</option><option value="scroll">滚动加载</option></select></label>
<button id="pick">选取下一页按钮</button><label>最短等待（秒） <input id="delay" type="number" min="0.2" step="0.1" value="1"></label>
<label>最长等待（秒） <input id="timeout" type="number" min="1" value="20"></label>
<label title="0 表示沿用默认速度。设置后，首次及后续翻页均遵守该间隔。">翻页间隔（秒） <input id="pageInterval" type="number" min="0" step="any" value="0"></label>
<button id="start">开始连续采集</button><button id="stop" disabled>停止</button></section>
<section><div class="toolbar"><strong id="stats">数据预览</strong><button id="reset">重置列</button><button id="copy">复制全部</button><button id="csv">导出 CSV</button><button id="xlsx">导出 Excel</button></div>
<p id="status" role="status">正在识别页面…</p><div class="grid"><table><thead></thead><tbody></tbody></table></div></section></main>
<script src="../scripts/lib/zip.js"></script><script src="../scripts/pages/web-data.js"></script></body></html>
